# Pull request checks and multi-arch image publication.
# Uses the unprivileged `pull_request` event only: PR code never runs with write tokens or secrets.
# Third-party Actions are pinned to full commit SHAs; the comment records the release tag.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  # Cancel superseded PR runs; main pushes have independent groups so pending runs are not replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        # Disposable CI-only database; these placeholder credentials protect nothing.
        env:
          POSTGRES_USER: nik
          POSTGRES_PASSWORD: nik
          POSTGRES_DB: nik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nik -d nik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nik:nik@localhost:5432/nik_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Ruff format
        run: python -m ruff format --check backend
      - name: Pytest (with PostgreSQL)
        run: python -m pytest backend/tests -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Oxlint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Type check and build
        run: npm run build

  recipes:
    name: Recipes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Recipe files are untrusted data: the validator parses them with a strict safe YAML loader
    # and JSON Schema. No file name or content is interpolated into shell or workflow code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recipes/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r recipes/requirements.txt
      - name: Validate recipes/*.yaml
        run: python recipes/validate.py
      - name: Validator and fixture tests
        run: python -m pytest recipes
      - name: Ruff
        run: |
          python -m ruff check recipes
          python -m ruff format --check recipes

  chart:
    # Name kept from the former applicability placeholder so the required check keeps its meaning.
    name: Helm chart applicability
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
      KIND_VERSION: v0.31.0
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
      CNPG_CHART_VERSION: 0.29.2
      CHART: deploy/chart/naileditkitchen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Helm and kind (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Helm lint and template
        run: |
          set -euo pipefail
          helm lint "$CHART" --set api.image.tag=ci --set web.image.tag=ci
          helm template naileditkitchen "$CHART" --namespace naileditkitchen \
            --set api.image.tag=ci --set web.image.tag=ci \
            --api-versions monitoring.coreos.com/v1 > /dev/null
          # Release safety: an unpublished chart or a moving tag must not render.
          if helm template naileditkitchen "$CHART" > /dev/null 2>&1; then
            echo "::error::chart rendered without an image tag or release appVersion"; exit 1
          fi
          if helm template naileditkitchen "$CHART" --set api.image.tag=latest --set web.image.tag=latest > /dev/null 2>&1; then
            echo "::error::chart rendered with a latest image tag"; exit 1
          fi
      - name: Build smoke-test images
        run: |
          docker build -t naileditkitchen-api:smoke-1 -f backend/Dockerfile .
          docker build -t naileditkitchen-web:smoke-1 -f frontend/Dockerfile frontend
          # A second tag of the same images exercises the upgrade path (new revision, new Job).
          docker tag naileditkitchen-api:smoke-1 naileditkitchen-api:smoke-2
          docker tag naileditkitchen-web:smoke-1 naileditkitchen-web:smoke-2
      - name: Create disposable kind cluster with CloudNativePG
        env:
          KUBECONFIG: ${{ runner.temp }}/kind.kubeconfig
        run: |
          kind create cluster --name nik-chart --image "$KIND_NODE_IMAGE" --wait 120s
          for image in naileditkitchen-api:smoke-1 naileditkitchen-api:smoke-2 \
            naileditkitchen-web:smoke-1 naileditkitchen-web:smoke-2; do
            kind load docker-image "$image" --name nik-chart
          done
          helm install cnpg cloudnative-pg --repo https://cloudnative-pg.github.io/charts \
            --version "$CNPG_CHART_VERSION" --kube-context kind-nik-chart \
            --namespace cnpg-system --create-namespace --wait --timeout 5m
      - name: Fresh install, upgrade and backup smoke test
        env:
          KUBECONFIG: ${{ runner.temp }}/kind.kubeconfig
          KUBE_CONTEXT: kind-nik-chart
          API_REPOSITORY: naileditkitchen-api
          WEB_REPOSITORY: naileditkitchen-web
          FIRST_TAG: smoke-1
          SECOND_TAG: smoke-2
        run: bash deploy/chart/smoke-test.sh
  image-build:
    name: Image build (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    # Builds each Dockerfile's final stage; that stage must remain the production image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: backend/Dockerfile
          - component: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false

  image-publish:
    name: Image publish (${{ matrix.component }})
    # Trusted pushes to main in this repository only, after every check passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dylanwhitetech/nailed-it-kitchen'
    needs: [backend, frontend, recipes, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push SHA-tagged images to this repository's GHCR packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: backend/Dockerfile
          - component: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the full commit SHA tag: never a moving tag such as latest.
          tags: ghcr.io/dylanwhitetech/naileditkitchen-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/dylanwhitetech/naileditkitchen-${{ matrix.component }}:${{ github.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published \`${IMAGE}\` (\`${DIGEST}\`) for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
