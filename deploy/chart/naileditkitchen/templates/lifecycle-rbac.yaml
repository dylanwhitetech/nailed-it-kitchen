{{- $name := printf "%s-lifecycle" (include "naileditkitchen.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "naileditkitchen.labels" (dict "root" . "component" "lifecycle") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "naileditkitchen.labels" (dict "root" . "component" "lifecycle") | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ printf "%s-api" (include "naileditkitchen.fullname" .) | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ printf "%s-migrate-%v" (include "naileditkitchen.fullname" .) .Release.Revision | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "naileditkitchen.labels" (dict "root" . "component" "lifecycle") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
