{{- $fullname := include "naileditkitchen.fullname" . }}
{{- $labels := dict "root" . "component" "web" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "naileditkitchen.labels" $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "naileditkitchen.selectorLabels" $labels | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "naileditkitchen.labels" $labels | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "naileditkitchen.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "naileditkitchen.labels" $labels | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "naileditkitchen.podSecurityContext" 101 | nindent 8 }}
      containers:
        - name: web
          image: {{ include "naileditkitchen.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- include "naileditkitchen.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # nginx writes its pid and temporary files under /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
