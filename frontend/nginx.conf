# Serves the built SPA on 8080. /api is routed to the backend by the ingress
# (production) or the Vite proxy (development), not by this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A location's add_header replaces these, so locations that add headers repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unknown /api paths must not fall back to the app shell.
    location /api/ {
        return 404;
    }

    # SPA fallback: unknown paths load index.html; the app renders its own not-found page.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
