slug: gooey-cinnamon-rolls
title: Gooey Cinnamon Rolls
ingredients:
  - 'Dough: 1 cup milk'
  - 'Dough: 2 1/4 tsp active dry yeast'
  - 'Dough: 1/4 cup sugar'
  - 'Dough: 1 egg plus 1 egg yolk'
  - 'Dough: 1/4 cup melted butter'
  - 'Dough: 1 tsp salt'
  - 'Dough: 3 1/2 cups flour in the original recipe; as made, 1 cup all-purpose flour plus 2 1/4 cups bread flour'
  - 'Filling: 1/2 cup butter'
  - 'Filling: 3/4 cup brown sugar'
  - 'Filling: 1 1/2 tbsp cinnamon'
  - 'Filling: 1/8 tsp salt'
  - 'Before baking: 1/3 cup warm heavy cream'
  - 'Frosting: 4 oz cream cheese'
  - 'Frosting: 4 tbsp butter'
  - 'Frosting: 1 cup powdered sugar'
  - 'Frosting: vanilla; amount unknown'
  - 'Frosting: 1-2 tbsp milk or cream'
instructions:
  - Prepare the dough with the listed dough ingredients; knead 5-6 minutes.
  - Cover and rise 60-90 minutes.
  - Roll the dough out, spread the filling, roll up and cut into rolls; place in the pan.
  - Proof 30-45 minutes.
  - Add the warm heavy cream before baking.
  - Bake at 350°F for 24-30 minutes.
  - Mix the frosting ingredients and frost the rolls.
notes:
  - 'Yield: 12 rolls planned; 11 rolls as made, including end pieces'
  - 'Pan: 9.5 × 13 × 1.5-inch'
  - The as-made flour total was 3 1/4 cups, less than the original 3 1/2 cups.
  - Overnight refrigeration is possible, but no confirmed overnight schedule was recorded.
  - 'Not recorded: exact dough mixing/blooming sequence, rectangle dimensions, vanilla amount and final bake outcome.'
