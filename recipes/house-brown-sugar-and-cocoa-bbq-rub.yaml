slug: house-brown-sugar-and-cocoa-bbq-rub
title: House Brown Sugar and Cocoa BBQ Rub
ingredients:
  - 8 parts brown sugar
  - 3 parts paprika
  - 1 part garlic powder
  - 1 part onion powder
  - 1 part salt
  - 1/2 part unsweetened cocoa powder
instructions:
  - Measure every ingredient using the same unit.
  - Mix thoroughly.
notes:
  - 'Yield: scalable ratio by volume'
  - 'Example: with 1 part = 1 tbsp, the batch makes 14 1/2 tbsp total.'
  - This formula has no black pepper or cayenne.
  - Paprika type and salt type are not specified.
