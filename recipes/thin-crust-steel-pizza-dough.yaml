slug: thin-crust-steel-pizza-dough
title: Thin-Crust Steel Pizza Dough
ingredients:
  - 4 cups bread flour
  - 1 1/3 cups plus 1 tbsp warm water (100-105°F)
  - 1/2 tsp active dry yeast
  - 1 1/2 tsp salt
  - 2 tsp olive oil
  - 1 tsp sugar or honey
instructions:
  - Mix the water, yeast and sugar; wait 5 minutes.
  - Mix on low for 2 minutes, then knead for 6 minutes.
  - Rise 45-60 minutes; divide into 4 balls.
  - Refrigerate reserved balls for 24-72 hours; remove them 2 hours before baking.
notes:
  - 'Yield: 4 × 13-inch pizzas'
  - An older estimate of about 225 g per ball conflicts with the ingredient total; weigh the actual batch and divide evenly.
  - This is a separate formula from the same-day Pizza Stone Dough.
  - 'Not recorded: steel preheat, oven temperature and bake time.'
