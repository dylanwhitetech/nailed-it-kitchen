slug: whole-smoked-turkey-with-butter-injection
title: Whole Smoked Turkey with Butter Injection
ingredients:
  - 1 whole turkey
  - House BBQ rub; amount unknown
  - 'Injection: 1 cup (240 ml) chicken broth'
  - 'Injection: 4 tbsp melted butter'
  - 'Injection: 2-3 tbsp (30-45 ml) apple juice'
  - 'Injection (optional, unconfirmed): 1/2-1 tsp low-salt rub'
  - 'Baste: 1 stick butter (113 g)'
  - 'Baste: 1/2 cup (120 ml) broth'
  - 'Baste: 2-4 tbsp (30-60 ml) apple juice'
  - 'Baste: 1/2 tsp low-salt rub'
instructions:
  - Do not brine. Apply the dry rub and inject the breasts with the broth, butter and apple juice.
  - Distribute the injection through 4-6 spots per breast.
  - Smoke whole at 275°F. Leave undisturbed for the first 2 hours.
  - Baste after 2 hours, then every 45-60 minutes.
  - Cook until the breast reaches 165°F and the thigh about 175°F; rest 30-45 minutes.
notes:
  - 'Yield: 1 whole turkey; recorded bird sizes are 15 lb and 12 lb'
  - A later version fixes the injection apple juice at 3 tbsp and the baste apple juice at 1/4 cup; the ranges above are the original amounts.
  - An older injection total of 350-475 ml does not match the listed ingredients; use the listed quantities.
  - 'Not recorded: exact rub amount, pellet choice and total cook time.'
